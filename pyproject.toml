[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Perfect and Pac-Man-like maze generator, from the 42 A-Maze-ing project"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "mpinto-l" }]
keywords = ["maze", "generator", "pacman", "42"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Typing :: Typed",
]

[tool.setuptools]
packages = ["mazegen"]
